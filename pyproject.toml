[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threads-gnn"
version = "0.1.0"
description = "Graph classification on SNAP Reddit Threads with GIN, PNA, and GAT"
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torch-geometric>=2.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "networkx>=3.1",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "huggingface_hub>=0.20.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[tool.setuptools]
py-modules = ["schemas", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "features*", "models*", "training*", "utils*", "scripts*"]
